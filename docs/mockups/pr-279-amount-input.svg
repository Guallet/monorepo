<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="990" viewBox="0 0 1320 990" role="img" aria-label="Three Guallet mobile amount entry mockups with a combined amount and currency field, focused editing, and currency selection">
  <defs>
    <style>
      text { font-family: Inter, Arial, sans-serif; fill: #231f20; }
      text[fill="#fff"] { fill: #fff; }
      text[fill="#005eb8"] { fill: #005eb8; }
      text[fill="#768692"] { fill: #768692; }
      text[fill="#425563"] { fill: #425563; }
      .heading { font-size: 28px; font-weight: 700; letter-spacing: -0.6px; }
      .sub { font-size: 14px; fill: #425563; }
      .phone-title { font-size: 21px; font-weight: 700; letter-spacing: -0.3px; }
      .label { font-size: 13px; font-weight: 600; }
      .field { font-size: 16px; font-weight: 500; }
      .meta { font-size: 12px; fill: #768692; }
      .amount { font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; }
      .key { font-size: 24px; font-weight: 500; text-anchor: middle; }
      .caption { font-size: 15px; font-weight: 700; fill: #003087; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#425563" flood-opacity="0.13"/></filter>
    <g id="status"><text x="25" y="29" font-size="13" font-weight="700">9:41</text><path d="M277 20v8m6-12v12m6-16v16" stroke="#231f20" stroke-width="2" stroke-linecap="round"/><path d="M301 20q8-8 16 0m-13 3q5-5 10 0" fill="none" stroke="#231f20" stroke-width="2" stroke-linecap="round"/><rect x="326" y="15" width="21" height="12" rx="3" fill="none" stroke="#231f20" stroke-width="1.4"/><rect x="329" y="18" width="14" height="6" rx="1" fill="#231f20"/><rect x="348" y="19" width="2" height="4" rx="1" fill="#231f20"/></g>
  </defs>
  <rect width="1320" height="990" fill="#f7fafc"/>
  <text x="44" y="52" class="heading">Guallet · mobile amount input</text>
  <text x="44" y="78" class="sub">PR #279 / issue #261 · Mercury-inspired combined amount and currency field</text>

  <!-- Screen 1: full form, including proposed use of AmountInput -->
  <g transform="translate(40 108)">
    <rect width="380" height="770" rx="34" fill="#fff" stroke="#e5e7eb" filter="url(#shadow)"/>
    <g transform="translate(10 10)"><use href="#status"/></g>
    <path d="M38 71l-8 8 8 8m-8-8h19" fill="none" stroke="#231f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="190" y="84" text-anchor="middle" class="phone-title">Add transaction</text>
    <rect x="24" y="112" width="332" height="43" rx="12" fill="#f5f5f5"/>
    <rect x="28" y="116" width="162" height="35" rx="9" fill="#fff" stroke="#e5e7eb"/>
    <text x="109" y="139" font-size="14" text-anchor="middle" font-weight="700" fill="#005eb8">Expense</text>
    <text x="272" y="139" font-size="14" text-anchor="middle" fill="#425563">Income</text>

    <text x="24" y="190" class="label">Merchant</text>
    <rect x="24" y="202" width="332" height="56" rx="16" fill="#fff" stroke="#e5e7eb"/>
    <text x="42" y="237" class="field">Coffee House</text>

    <text x="24" y="292" class="label">Category</text>
    <rect x="24" y="304" width="332" height="56" rx="16" fill="#fff" stroke="#e5e7eb"/>
    <circle cx="52" cy="332" r="14" fill="#e8f4fc"/>
    <text x="52" y="337" text-anchor="middle" font-size="16" fill="#005eb8">◯</text>
    <text x="78" y="338" class="field">Food &amp; drink</text>
    <path d="m330 328 6 6 6-6" fill="none" stroke="#768692" stroke-width="2"/>

    <text x="24" y="394" class="label">Amount</text>
    <rect x="24" y="406" width="332" height="56" rx="16" fill="#fff" stroke="#e5e7eb"/>
    <text x="42" y="440" class="amount">£24.50</text>
    <path d="M259 406v56" stroke="#e5e7eb"/>
    <text x="276" y="440" class="field">GBP</text>
    <path d="m331 431 5 5 5-5" fill="none" stroke="#768692" stroke-width="2"/>
    <text x="24" y="496" class="label">Date</text>
    <rect x="24" y="508" width="332" height="56" rx="16" fill="#fff" stroke="#e5e7eb"/>
    <text x="42" y="542" class="field">Today, 27 September 2026</text>
    <text x="24" y="598" class="label">Account</text>
    <rect x="24" y="610" width="332" height="56" rx="16" fill="#fff" stroke="#e5e7eb"/>
    <text x="42" y="644" class="field">Current account</text>
    <path d="m330 633 6 6 6-6" fill="none" stroke="#768692" stroke-width="2"/>
    <rect x="24" y="697" width="332" height="52" rx="10" fill="#005eb8"/>
    <text x="190" y="729" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Save transaction</text>
  </g>

  <!-- Screen 2: focused field and native numeric keyboard -->
  <g transform="translate(470 108)">
    <rect width="380" height="770" rx="34" fill="#fff" stroke="#e5e7eb" filter="url(#shadow)"/>
    <g transform="translate(10 10)"><use href="#status"/></g>
    <path d="M38 71l-8 8 8 8m-8-8h19" fill="none" stroke="#231f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="190" y="84" text-anchor="middle" class="phone-title">Add transaction</text>
    <text x="24" y="137" class="meta">Expense  /  Coffee House</text>
    <text x="24" y="182" class="label">Amount</text>
    <rect x="24" y="196" width="332" height="56" rx="16" fill="#fff" stroke="#005eb8" stroke-width="2"/>
    <text x="42" y="231" class="amount">£24.5</text>
    <rect x="84" y="211" width="2" height="27" rx="1" fill="#005eb8"/>
    <path d="M259 196v56" stroke="#e5e7eb"/>
    <text x="276" y="231" class="field">GBP</text>
    <path d="m331 222 5 5 5-5" fill="none" stroke="#768692" stroke-width="2"/>
    <text x="24" y="280" class="meta">Pound sterling · up to 2 decimal places</text>
    <text x="24" y="326" class="label">Merchant</text>
    <rect x="24" y="338" width="332" height="56" rx="16" fill="#fff" stroke="#e5e7eb"/>
    <text x="42" y="373" class="field">Coffee House</text>
    <rect x="24" y="440" width="332" height="50" rx="10" fill="#005eb8"/>
    <text x="190" y="471" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Done</text>
    <rect x="1" y="511" width="378" height="258" rx="0" fill="#e8edee"/>
    <g fill="#fff" stroke="#d5dcdf">
      <rect x="6" y="517" width="119" height="55" rx="5"/><rect x="131" y="517" width="119" height="55" rx="5"/><rect x="256" y="517" width="118" height="55" rx="5"/>
      <rect x="6" y="578" width="119" height="55" rx="5"/><rect x="131" y="578" width="119" height="55" rx="5"/><rect x="256" y="578" width="118" height="55" rx="5"/>
      <rect x="6" y="639" width="119" height="55" rx="5"/><rect x="131" y="639" width="119" height="55" rx="5"/><rect x="256" y="639" width="118" height="55" rx="5"/>
      <rect x="131" y="700" width="119" height="55" rx="5"/>
    </g>
    <text x="66" y="553" class="key">1</text><text x="191" y="553" class="key">2</text><text x="315" y="553" class="key">3</text>
    <text x="66" y="614" class="key">4</text><text x="191" y="614" class="key">5</text><text x="315" y="614" class="key">6</text>
    <text x="66" y="675" class="key">7</text><text x="191" y="675" class="key">8</text><text x="315" y="675" class="key">9</text>
    <text x="66" y="736" class="key">.</text><text x="191" y="736" class="key">0</text><text x="315" y="736" class="key">⌫</text>
  </g>

  <!-- Screen 3: currency picker opens as a bottom sheet from the amount field -->
  <g transform="translate(900 108)">
    <rect width="380" height="770" rx="34" fill="#fff" stroke="#e5e7eb" filter="url(#shadow)"/>
    <g transform="translate(10 10)"><use href="#status"/></g>
    <path d="M38 71l-8 8 8 8m-8-8h19" fill="none" stroke="#231f20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="190" y="84" text-anchor="middle" class="phone-title">Add transaction</text>
    <text x="24" y="139" class="label">Amount</text>
    <rect x="24" y="152" width="332" height="56" rx="16" fill="#fff" stroke="#005eb8" stroke-width="2"/>
    <text x="42" y="187" class="amount">£24.50</text>
    <path d="M259 152v56" stroke="#e5e7eb"/>
    <text x="276" y="187" class="field">GBP</text>
    <path d="m331 178 5 5 5-5" fill="none" stroke="#768692" stroke-width="2"/>
    <rect x="1" y="0" width="378" height="770" rx="34" fill="#231f20" opacity="0.24"/>
    <path d="M1 275q0-28 28-28h322q28 0 28 28v495H1Z" fill="#f7fafc"/>
    <rect x="161" y="259" width="58" height="5" rx="2.5" fill="#c8d1d6"/>
    <text x="190" y="303" text-anchor="middle" class="phone-title">Choose currency</text>
    <circle cx="338" cy="293" r="18" fill="#fff"/>
    <path d="m333 288 10 10m0-10-10 10" stroke="#425563" stroke-width="1.8" stroke-linecap="round"/>
    <rect x="24" y="324" width="332" height="52" rx="16" fill="#fff" stroke="#e5e7eb"/>
    <circle cx="49" cy="349" r="8" fill="none" stroke="#768692" stroke-width="2"/><path d="m55 355 7 7" stroke="#768692" stroke-width="2"/>
    <text x="76" y="356" class="field" fill="#768692">Search currencies</text>
    <text x="24" y="413" class="label">Popular</text>
    <rect x="24" y="427" width="332" height="225" rx="16" fill="#fff" stroke="#e5e7eb"/>
    <rect x="39" y="443" width="42" height="42" rx="8" fill="#e8f4fc"/>
    <text x="60" y="471" font-size="25" font-weight="700" text-anchor="middle" fill="#005eb8">£</text>
    <text x="96" y="459" class="field">Pound sterling</text><text x="96" y="480" class="meta">GBP · 2 decimals</text>
    <circle cx="328" cy="464" r="11" fill="#fff" stroke="#005eb8" stroke-width="2"/><circle cx="328" cy="464" r="5" fill="#005eb8"/>
    <path d="M39 499h302" stroke="#e8edee"/>
    <rect x="39" y="517" width="42" height="42" rx="8" fill="#e8f4fc"/>
    <text x="60" y="545" font-size="25" font-weight="700" text-anchor="middle" fill="#005eb8">€</text>
    <text x="96" y="533" class="field">Euro</text><text x="96" y="554" class="meta">EUR · 2 decimals</text>
    <circle cx="328" cy="538" r="11" fill="#fff" stroke="#768692" stroke-width="1.5"/>
    <path d="M39 573h302" stroke="#e8edee"/>
    <rect x="39" y="591" width="42" height="42" rx="8" fill="#e8f4fc"/>
    <text x="60" y="619" font-size="23" font-weight="700" text-anchor="middle" fill="#005eb8">¥</text>
    <text x="96" y="607" class="field">Japanese yen</text><text x="96" y="628" class="meta">JPY · 0 decimals</text>
    <circle cx="328" cy="612" r="11" fill="#fff" stroke="#768692" stroke-width="1.5"/>
    <text x="190" y="698" text-anchor="middle" class="meta">Tap a currency to apply and close</text>
    <rect x="138" y="749" width="104" height="4" rx="2" fill="#231f20"/>
  </g>
  <text x="40" y="920" class="caption">01 · Form context</text>
  <text x="470" y="920" class="caption">02 · Editing in place</text>
  <text x="900" y="920" class="caption">03 · Currency BottomSheet</text>
  <text x="40" y="947" class="sub">A proposed transaction screen. PR #279 currently adds only the reusable field, not this flow.</text>
</svg>
