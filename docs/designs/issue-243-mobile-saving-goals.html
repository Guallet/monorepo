<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Guallet · Mobile saving goals · Issue 243</title>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#231f20;background:#edf3f8}*{box-sizing:border-box}body{margin:0}main{max-width:1320px;margin:auto;padding:40px 24px 70px}h1{font-size:36px;letter-spacing:-.025em;color:#003087;margin:4px 0 8px}.eyebrow{font-size:12px;letter-spacing:.08em;color:#005eb8;font-weight:700;text-transform:uppercase}.intro{max-width:900px;color:#425563;line-height:1.5;margin:0 0 30px}.grid{display:grid;grid-template-columns:repeat(3,390px);gap:34px 24px;justify-content:center}.panel h2{font-size:18px;color:#003087;margin:0 0 5px}.panel>p{font-size:13px;line-height:1.4;color:#425563;height:36px;margin:0 0 12px}.phone{position:relative;width:390px;height:810px;border:6px solid #231f20;border-radius:38px;background:#f7fafc;overflow:hidden;box-shadow:0 14px 32px rgba(0,48,135,.12)}.status{height:42px;padding:14px 25px 0;background:#fff;display:flex;justify-content:space-between;font-size:13px;font-weight:700}.island{position:absolute;top:9px;left:50%;width:84px;height:20px;transform:translateX(-50%);border-radius:14px;background:#231f20}.nav{height:56px;background:#fff;border-bottom:1px solid #e8edee;padding:0 18px;display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700}.back{font-size:27px;color:#005eb8;font-weight:400;line-height:1}.nav .right{margin-left:auto;color:#005eb8;font-size:14px;font-weight:600}.content{padding:20px 18px 100px;height:calc(100% - 98px);overflow:hidden}.title{font-size:27px;letter-spacing:-.02em;margin:0 0 5px}.sub{color:#425563;font-size:14px;line-height:1.4;margin:0 0 18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.05);overflow:hidden}.card+.card{margin-top:12px}.card-pad{padding:17px}.label{font-size:12px;color:#768692;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin:21px 0 8px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid #e8edee;font-size:14px;min-height:54px}.row:last-child{border:0}.row small{display:block;font-size:12px;color:#768692;margin-top:4px}.value{color:#425563;text-align:right}.muted{color:#768692}.blue{color:#005eb8}.green{color:#009639}.red{color:#da291c}.money{font-variant-numeric:tabular-nums;font-weight:700}.big{font-size:30px;letter-spacing:-.025em}.progress{height:8px;border-radius:8px;background:#e8edee;overflow:hidden;margin:13px 0 10px}.fill{height:100%;border-radius:8px;background:#005eb8}.goal-title{font-size:18px;font-weight:700;display:flex;justify-content:space-between;align-items:center}.goal-meta{display:flex;justify-content:space-between;font-size:12px;color:#425563}.pill{display:inline-flex;align-items:center;border-radius:20px;padding:5px 9px;background:#e8f3fb;color:#005eb8;font-size:12px;font-weight:700}.pill.good{background:#e5f5e9;color:#006747}.pill.late{background:#fbe9e7;color:#da291c}.button{min-height:50px;border-radius:8px;background:#005eb8;color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;padding:0 16px}.button.outline{background:#fff;color:#005eb8;border:1px solid #005eb8}.button.danger{background:#da291c}.button.disabled{background:#d1d5db;color:#9ca3af}.footer{position:absolute;bottom:0;left:0;right:0;padding:12px 18px 30px;background:#fff;border-top:1px solid #e8edee}.footer .button+.button{margin-top:8px}.home{position:absolute;bottom:8px;left:50%;width:105px;height:5px;background:#231f20;border-radius:5px;transform:translateX(-50%)}.tabs{position:absolute;bottom:0;left:0;right:0;height:72px;background:#fff;border-top:1px solid #e8edee;display:flex;justify-content:space-around;padding:10px 8px 23px}.tab{text-align:center;font-size:10px;color:#768692;line-height:1.2}.tab i{display:block;font-style:normal;font-size:20px;margin-bottom:4px}.tab.active{color:#005eb8;font-weight:700}.field{margin:0 0 15px}.field label{display:block;color:#425563;font-size:13px;font-weight:600;margin-bottom:7px}.input{min-height:47px;background:#fff;border:1px solid #d9e1e5;border-radius:8px;padding:12px;font-size:14px;display:flex;align-items:center;justify-content:space-between;color:#231f20}.input.multi{height:68px;align-items:flex-start}.input.error{border:1.5px solid #da291c}.hint{font-size:12px;color:#768692;margin-top:5px;line-height:1.3}.hint.error{color:#da291c}.form{padding:17px}.scrim{position:absolute;inset:42px 0 0;background:rgba(12,32,48,.45)}.sheet{position:absolute;bottom:0;left:0;right:0;height:475px;background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.12)}.handle{height:4px;width:36px;border-radius:4px;background:#c3cdd4;margin:10px auto}.sheet-head{padding:14px 19px 18px;display:flex;justify-content:space-between;font-size:18px;font-weight:700;border-bottom:1px solid #e8edee}.check{width:22px;height:22px;border:1.5px solid #768692;border-radius:5px;display:grid;place-items:center;color:#fff}.check.on{background:#005eb8;border-color:#005eb8}.dialog{position:absolute;left:26px;right:26px;top:280px;padding:23px;background:#fff;border-radius:16px;box-shadow:0 20px 40px rgba(0,0,0,.16)}.dialog h3{font-size:20px;margin:0 0 8px}.dialog p{color:#425563;line-height:1.45;font-size:14px;margin:0 0 20px}.dialog .button+.button{margin-top:8px}.center{display:flex;flex-direction:column;align-items:center;text-align:center;padding:34px 18px}.circle{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:#e8f3fb;color:#005eb8;font-size:27px;margin-bottom:16px}.center h3{font-size:20px;margin:0 0 8px}.center p{font-size:14px;color:#425563;line-height:1.45;margin:0 0 19px}.dashed{border:2px dashed #d1d5db;box-shadow:none}.skeleton{height:18px;background:#e8edee;border-radius:7px;margin:11px 0}.toast{padding:11px 13px;border-radius:8px;background:#fbe9e7;color:#ad2117;font-size:13px;line-height:1.35;margin-bottom:14px}.note{font-size:12px;color:#768692;line-height:1.45;margin-top:10px}@media(max-width:1280px){.grid{grid-template-columns:repeat(2,390px)}}@media(max-width:850px){main{padding:26px 12px}.grid{grid-template-columns:390px}}
  </style>
</head>
<body><main><div class="eyebrow">Issue #243 · Design reference</div><h1>Saving goals on mobile</h1><p class="intro">A complete flow built around the dashboard widget. Values are illustrative. The frames below cover each destination and its important states. Goal progress comes from the balances of linked accounts.</p><div class="grid" id="grid"></div></main>
<script>
const status='<div class="status">9:41 <span>●●● ▰</span></div><div class="island"></div>';
const home='<div class="home"></div>';
const tabs='<div class="tabs"><div class="tab active"><i>⌂</i>Dashboard</div><div class="tab"><i>▤</i>Accounts</div><div class="tab"><i>≡</i>Transactions</div><div class="tab"><i>◫</i>Budgets</div><div class="tab"><i>⚙</i>Settings</div></div>';
const nav=(title,right='')=>`<div class="nav"><span class="back">‹</span>${title}<span class="right">${right}</span></div>`;
const panel=(title,description,body)=>`<section class="panel"><h2>${title}</h2><p>${description}</p><div class="phone">${status}${body}${home}</div></section>`;
const goal=(name,saved,target,pct,meta,badge)=>`<div class="card card-pad"><div class="goal-title">${name}<span class="pill ${badge==='Complete'?'good':badge==='Overdue'?'late':''}">${badge}</span></div><div class="progress"><div class="fill" style="width:${pct}%"></div></div><div class="goal-meta"><span><span class="money">${saved}</span> of ${target}</span><strong class="blue">${pct}%</strong></div><div class="hint">${meta}</div></div>`;
const form=(edit=false,invalid=false)=>`<div class="content"><h1 class="title">${edit?'Edit goal':'Create a goal'}</h1><p class="sub">${edit?'Update the target and linked accounts.':'Choose what you are saving towards.'}</p>${invalid?'<div class="toast">Couldn’t save this goal. Check the fields below and try again.</div>':''}<div class="card form"><div class="field"><label>Goal name *</label><div class="input ${invalid?'error':''}">${edit?'New laptop':invalid?'':'e.g. Emergency fund'}</div>${invalid?'<div class="hint error">Enter a goal name.</div>':''}</div><div class="field"><label>Target amount *</label><div class="input ${invalid?'error':''}">${edit?'£2,000':invalid?'£0':'£5,000'}</div>${invalid?'<div class="hint error">Enter an amount above £0.</div>':''}</div><div class="field"><label>Target date <span class="muted">(optional)</span></label><div class="input">${edit?'30 June 2027':'Select a date'} <span class="muted">▦</span></div></div><div class="field"><label>Linked accounts *</label><div class="input ${invalid?'error':''}">${edit?'Savings account':'Select accounts'} <span class="muted">›</span></div>${invalid?'<div class="hint error">Select at least one account.</div>':'<div class="hint">Progress follows the balance of these accounts.</div>'}</div><div class="field"><label>Description <span class="muted">(optional)</span></label><div class="input multi">${edit?'A replacement for my current laptop.':'Add a note'}</div></div></div></div><div class="footer"><div class="button">${edit?'Save changes':'Create goal'}</div></div>`;
const frames=[
  panel('1 · Dashboard entry','The existing widget links into the complete goals list.',`<div class="nav">Dashboard</div><div class="content"><h1 class="title">Overview</h1><p class="sub">Your money at a glance</p><div class="card card-pad"><div class="goal-title">Total balance</div><div class="money big" style="margin-top:12px">£12,480</div><div class="hint">Across your accounts</div></div><div class="label">YOUR GOALS</div><div class="card card-pad"><div class="goal-title">Saving goals <span class="blue" style="font-size:13px">See all →</span></div><div style="margin-top:16px"><strong>Emergency fund</strong><div class="progress"><div class="fill" style="width:64%"></div></div><div class="goal-meta"><span>£3,200 / £5,000</span><span>64%</span></div></div><div style="margin-top:19px"><strong>New laptop</strong><div class="progress"><div class="fill" style="width:35%"></div></div><div class="goal-meta"><span>£700 / £2,000</span><span>35%</span></div></div></div></div>${tabs}`),
  panel('2 · All saving goals','All goals and progress remain visible in one scrollable list.',`${nav('Saving goals','+ Add')}<div class="content"><h1 class="title">Saving goals</h1><p class="sub">Track what you are saving towards.</p>${goal('Emergency fund','£3,200','£5,000',64,'Savings account · 31 Dec 2027','On track')}${goal('New laptop','£700','£2,000',35,'Savings account · 30 Jun 2027','On track')}${goal('Summer trip','£1,800','£1,800',100,'Holiday account · 1 Aug 2027','Complete')}${goal('Car deposit','£900','£4,000',22,'Savings account · 1 Sep 2026','Overdue')}</div>`),
  panel('3 · Goal details','Show the target, current amount, deadline, and linked accounts.',`${nav('Goal details','Edit')}<div class="content"><h1 class="title">Emergency fund</h1><p class="sub">A reserve for unexpected costs.</p><div class="card card-pad"><span class="pill">On track</span><div class="money big" style="margin-top:15px">£3,200</div><div class="muted" style="font-size:14px">saved towards £5,000</div><div class="progress" style="height:10px"><div class="fill" style="width:64%"></div></div><div class="goal-meta"><strong>64% complete</strong><span>£1,800 remaining</span></div></div><div class="label">GOAL DETAILS</div><div class="card"><div class="row">Target amount <strong class="money">£5,000</strong></div><div class="row">Current amount <strong class="money">£3,200</strong></div><div class="row">Target date <strong>31 Dec 2027</strong></div><div class="row">Linked accounts <strong>Savings account</strong></div></div><div class="note">Progress updates when the linked account balance changes.</div><div class="label">MANAGE</div><div class="card"><div class="row blue">Edit goal <span>›</span></div><div class="row red">Delete goal <span>›</span></div></div></div>`),
  panel('4 · Create goal','A single form keeps the required fields together.',`${nav('New goal')}${form(false)}`),
  panel('5 · Choose accounts','A multi-select sheet links one or more existing accounts.',`${nav('New goal')}<div class="content"><h1 class="title">Create a goal</h1><p class="sub">Choose what you are saving towards.</p><div class="card form"><div class="field"><label>Goal name</label><div class="input">Emergency fund</div></div><div class="field"><label>Target amount</label><div class="input">£5,000</div></div><div class="field"><label>Linked accounts</label><div class="input">Savings account <span>›</span></div></div></div></div><div class="scrim"></div><div class="sheet"><div class="handle"></div><div class="sheet-head">Linked accounts <span class="blue" style="font-size:14px">Cancel</span></div><div class="row"><div><strong>Savings account</strong><small>£3,200 · GBP</small></div><span class="check on">✓</span></div><div class="row"><div><strong>Holiday account</strong><small>£1,800 · GBP</small></div><span class="check"></span></div><div class="row"><div><strong>Everyday account</strong><small>£2,450 · GBP</small></div><span class="check"></span></div><div class="footer"><div class="button">Apply accounts</div></div></div>`),
  panel('6 · Edit goal','Reuse the form with existing values and a clear save action.',`${nav('Edit goal')}${form(true)}`),
  panel('7 · Delete confirmation','Name the goal and require an explicit destructive action.',`${nav('Goal details','Edit')}<div class="content"><h1 class="title">New laptop</h1><div class="card card-pad"><div class="money big">£700</div><div class="muted">saved towards £2,000</div><div class="progress"><div class="fill" style="width:35%"></div></div></div></div><div class="scrim"></div><div class="dialog"><h3>Delete “New laptop”?</h3><p>This goal and its progress will be removed. Your linked account and its balance will stay as they are.</p><div class="button danger">Delete goal</div><div class="button outline">Keep goal</div></div>`),
  panel('8 · Empty goals','Give first-time users a direct path to create a goal.',`${nav('Saving goals','+ Add')}<div class="content"><h1 class="title">Saving goals</h1><p class="sub">Track what you are saving towards.</p><div class="card dashed center" style="margin-top:38px"><div class="circle">◎</div><h3>No saving goals yet</h3><p>Create a goal, choose a target, and link an account to track progress.</p><div class="button" style="width:100%">Create your first goal</div></div></div>`),
  panel('9 · Loading and list error','Use skeleton cards while loading; retry if the request fails.',`${nav('Saving goals','+ Add')}<div class="content"><h1 class="title">Saving goals</h1><div class="card card-pad"><div class="skeleton" style="width:55%"></div><div class="skeleton" style="width:100%;height:8px;margin-top:24px"></div><div class="skeleton" style="width:75%"></div></div><div class="card card-pad"><div class="skeleton" style="width:60%"></div><div class="skeleton" style="width:100%;height:8px;margin-top:24px"></div><div class="skeleton" style="width:70%"></div></div><div class="label">IF LOADING FAILS</div><div class="card center"><div class="circle" style="background:#fbe9e7;color:#da291c">!</div><h3>Couldn’t load goals</h3><p>Check your connection and try again.</p><div class="button outline" style="width:100%">Try again</div></div></div>`),
  panel('10 · Validation and save error','Keep the entered values and show field errors near each input.',`${nav('New goal')}${form(false,true)}`),
];
document.getElementById('grid').innerHTML=frames.join('');
</script></body></html>
