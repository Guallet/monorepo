  <style>
    :root{--blue:#005eb8;--deep:#003087;--page:#f7fafc;--line:#e5e7eb;--muted:#425563;--pale:#e8edee;--red:#da291c;--green:#009639;--ink:#231f20;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:#eaf1f7}*{box-sizing:border-box}body{margin:0}main{max-width:1390px;margin:auto;padding:36px 20px 70px}h1{font-size:36px;letter-spacing:-.025em;color:var(--deep);margin:4px 0 7px}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--blue)}.intro{max-width:850px;color:var(--muted);font-size:15px;line-height:1.5;margin:0 0 28px}.grid{display:grid;grid-template-columns:repeat(3,390px);gap:32px 26px;justify-content:center}.panel h2{color:var(--deep);font-size:18px;margin:0 0 4px}.panel>p{height:34px;color:var(--muted);font-size:13px;line-height:1.3;margin:0 0 12px}.phone{position:relative;width:390px;height:812px;border:6px solid #1c2530;border-radius:40px;background:var(--page);overflow:hidden;box-shadow:0 14px 35px #00305725}.status{height:42px;background:#fff;padding:14px 24px 0;display:flex;justify-content:space-between;font-size:13px;font-weight:700}.island{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:82px;height:20px;border-radius:16px;background:#1c2530}.nav{height:55px;padding:0 18px;display:flex;align-items:center;gap:13px;background:#fff;border-bottom:1px solid var(--pale);font-size:18px;font-weight:700}.back{color:var(--blue);font-size:26px;font-weight:400;line-height:1}.nav-right{margin-left:auto;color:var(--blue);font-size:14px;font-weight:600}.nav-right.danger{color:var(--red)}.content{padding:18px 17px 94px;height:calc(100% - 97px);overflow:hidden}.title{font-size:27px;letter-spacing:-.02em;margin:0 0 4px}.sub{font-size:14px;color:var(--muted);line-height:1.38;margin:0 0 16px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 3px #0000000d,0 1px 2px #0000000a;overflow:hidden}.pad{padding:17px}.card+.card{margin-top:11px}.month{display:flex;align-items:center;justify-content:space-between;margin:0 0 15px;background:#fff;border:1px solid var(--line);border-radius:32px;height:48px;padding:0 12px;box-shadow:0 1px 2px #0000000a;font-weight:700}.month span:first-child,.month span:last-child{color:var(--blue);font-size:24px;font-weight:400;width:32px;text-align:center}.month .off{color:#b8c4cb!important}.section{font-size:12px;color:#768692;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin:21px 0 8px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;min-height:55px;border-bottom:1px solid var(--pale);font-size:14px}.row:last-child{border:0}.row small{display:block;font-size:12px;color:#768692;margin-top:4px}.row .end{text-align:right}.money{font-variant-numeric:tabular-nums;font-weight:700}.big{font-size:30px;letter-spacing:-.025em}.blue{color:var(--blue)}.red{color:var(--red)}.green{color:var(--green)}.muted{color:#768692}.progress{height:8px;border-radius:8px;background:var(--pale);overflow:hidden;margin:13px 0 9px}.fill{height:100%;background:var(--blue);border-radius:8px}.fill.red-bg{background:var(--red)}.fill.green-bg{background:var(--green)}.fill.warning-bg{background:#fae100}.amber{color:#705d00}.meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}.card-title{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}.card-title .chev{margin-left:auto;color:#768692;font-size:20px;font-weight:400}.icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--blue);background:#e8f3fb;font-size:19px;flex:none}.icon.red-icon{background:#fbe9e7;color:var(--red)}.badge{display:inline-flex;padding:5px 9px;border-radius:20px;background:#e8f3fb;color:var(--blue);font-size:11px;font-weight:700}.badge.warning{background:#fff8d4;color:#705d00}.badge.over{background:#fbe9e7;color:var(--red)}.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:17px}.summary-grid small{display:block;font-size:12px;color:#768692;margin-bottom:4px}.summary-grid strong{font-size:16px}.button{height:49px;border-radius:8px;background:var(--blue);color:white;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;padding:0 14px}.button.outline{background:#fff;color:var(--blue);border:1px solid var(--blue)}.button.danger{background:var(--red)}.button.disabled{background:#d1d5db;color:#9ca3af}.footer{position:absolute;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--pale);padding:12px 18px 31px}.footer .button+.button{margin-top:8px}.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:106px;height:5px;border-radius:6px;background:#1c2530}.tabs{position:absolute;bottom:0;left:0;right:0;height:73px;background:#fff;border-top:1px solid var(--pale);display:flex;justify-content:space-around;padding:10px 6px 22px}.tab{text-align:center;font-size:10px;color:#768692}.tab i{display:block;font-style:normal;font-size:19px;margin-bottom:4px}.tab.active{color:var(--blue);font-weight:700}.field{margin:0 0 15px}.field label{display:block;font-weight:600;font-size:13px;color:var(--muted);margin:0 0 7px}.input{min-height:48px;background:#fff;border:1px solid #d5dfe5;border-radius:8px;padding:12px;font-size:14px;display:flex;justify-content:space-between;align-items:center}.input.error{border:1.5px solid var(--red)}.hint{font-size:12px;line-height:1.35;color:#768692;margin-top:5px}.hint.error{color:var(--red)}.notice{padding:12px 14px;border-radius:8px;background:#e8f3fb;color:var(--deep);font-size:12px;line-height:1.4}.toast{padding:11px 13px;border-radius:8px;background:#fbe9e7;color:#ad2117;font-size:13px;line-height:1.35;margin-bottom:14px}.scrim{position:absolute;inset:42px 0 0;background:#0c203075}.sheet{position:absolute;bottom:0;left:0;right:0;background:#fff;border-radius:24px 24px 0 0;height:560px;box-shadow:0 -8px 30px #0000001f}.handle{height:4px;width:36px;background:#c3cdd4;border-radius:4px;margin:10px auto}.sheet-head{padding:13px 18px 15px;border-bottom:1px solid var(--pale);display:flex;justify-content:space-between;align-items:center;font-size:18px;font-weight:700}.sheet-head span{font-size:13px;color:var(--blue)}.check{height:23px;width:23px;border:1.5px solid #768692;border-radius:5px;display:grid;place-items:center;color:#fff}.check.on{border-color:var(--blue);background:var(--blue)}.dialog{position:absolute;top:270px;left:25px;right:25px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 20px 40px #0000002c}.dialog h3{font-size:20px;margin:0 0 8px}.dialog p{font-size:14px;line-height:1.45;color:var(--muted);margin:0 0 20px}.dialog .button+.button{margin-top:8px}.center{display:flex;flex-direction:column;align-items:center;text-align:center;padding:36px 18px}.center .icon{height:57px;width:57px;border-radius:18px;font-size:28px;margin-bottom:16px}.center h3{font-size:20px;margin:0 0 8px}.center p{font-size:14px;color:var(--muted);line-height:1.45;margin:0 0 19px}.dashed{border:2px dashed #d1d5db;box-shadow:none}.skeleton{height:18px;border-radius:7px;background:var(--pale);margin:10px 0}.small-note{font-size:12px;line-height:1.4;color:#768692;margin-top:10px}.chip{display:inline-flex;border:1px solid var(--line);border-radius:16px;padding:6px 10px;font-size:12px;margin:3px 4px 3px 0;background:#fff}.chip.on{border-color:var(--blue);background:#e8f3fb;color:var(--blue);font-weight:700}@media(max-width:1260px){.grid{grid-template-columns:repeat(2,390px)}}@media(max-width:850px){main{padding:26px 10px}.grid{grid-template-columns:390px}}@media(max-width:410px){.grid{transform:scale(.86);transform-origin:top center;margin-bottom:-1200px}}
  </style>
</head>
<body><main><div class="eyebrow">Issue #242 · Design proposal</div><h1>Monthly budgets on mobile</h1><p class="intro">A review board for the full budget journey and its key states. The figures are illustrative. Budgets recur every month; the selected month changes the spending and transactions shown.</p><div class="grid" id="grid"></div></main>
<script>
const status='<div class="status">9:41 <span>●●● ▰</span></div><div class="island"></div>',home='<div class="home"></div>';
const tabs='<div class="tabs"><div class="tab"><i>⌂</i>Home</div><div class="tab"><i>▤</i>Accounts</div><div class="tab"><i>≡</i>Transactions</div><div class="tab active"><i>▥</i>Budgets</div><div class="tab"><i>⚙</i>Settings</div></div>';
const nav=(title,right='',danger=false)=>`<div class="nav"><span class="back">‹</span>${title}<span class="nav-right ${danger?'danger':''}">${right}</span></div>`;
const panel=(title,description,body)=>`<section class="panel"><h2>${title}</h2><p>${description}</p><div class="phone">${status}${body}${home}</div></section>`;
const month=(name='October 2026',next=false)=>`<div class="month"><span>‹</span><strong>${name}</strong><span class="${next?'':'off'}">›</span></div>`;
const budget=(name,spent,total,pct,remaining,kind='normal',icon='▤')=>`<div class="card pad"><div class="card-title"><span class="icon ${kind==='over'?'red-icon':''}">${icon}</span><span>${name}<br><small style="font-size:12px;color:#768692;font-weight:400">${name==='Groceries'?'2 categories':'1 category'}</small></span><span style="margin-left:auto;text-align:right"><strong class="money ${kind==='over'?'red':kind==='near'?'amber':'green'}" style="font-size:15px">${remaining.replace(' remaining','').replace(' over budget','')}</strong><small style="display:block;font-size:12px;color:#768692;font-weight:400">${kind==='over'?'over budget':'left'}</small></span></div><div class="progress"><div class="fill ${kind==='over'?'red-bg':kind==='near'?'warning-bg':'green-bg'}" style="width:${Math.min(pct,100)}%"></div></div><div class="meta"><span><strong class="money">${spent}</strong> of ${total} spent</span><strong class="${kind==='over'?'red':kind==='near'?'amber':'green'}">${Math.min(pct,100)}%</strong></div></div>`;
const summary=(old=false)=>`<div class="card pad"><div class="meta"><span>BUDGET OVERVIEW</span><span>3 budgets · ${old?'94':'77'}% used</span></div><div class="progress" style="height:10px"><div class="fill ${old?'warning-bg':'green-bg'}" style="width:${old?94:77}%"></div></div><div class="summary-grid"><div><small>Budgeted</small><strong class="money">£800</strong></div><div><small>Spent</small><strong class="money red">${old?'£750':'£615'}</strong></div><div><small>Remaining</small><strong class="money green">${old?'£50':'£185'}</strong></div></div></div>`;
const transactions=`<div class="section">TRANSACTIONS THIS MONTH</div><div class="card"><div class="row"><span><strong>Tesco</strong><small>Groceries · Current account · 19 Oct</small></span><strong class="money red">−£42.80</strong></div><div class="row"><span><strong>Waitrose</strong><small>Groceries · Current account · 15 Oct</small></span><strong class="money red">−£64.15</strong></div><div class="row"><span><strong>Co-op</strong><small>Groceries · Current account · 12 Oct</small></span><strong class="money red">−£23.05</strong></div><div class="row blue" style="justify-content:center;font-weight:600">See all transactions</div></div>`;
const form=(edit=false,invalid=false)=>`<div class="content"><h1 class="title">${edit?'Edit budget':'Create a budget'}</h1><p class="sub">${edit?'Update your monthly spending limit.':'Set a limit that applies every month.'}</p>${invalid?'<div class="toast">Couldn’t save this budget. Your changes are still here.</div>':''}<div class="card pad"><div class="field"><label>Name *</label><div class="input ${invalid?'error':''}">${edit?'Groceries':invalid?'':'e.g. Groceries'}</div>${invalid?'<div class="hint error">Enter a name with at least two characters.</div>':''}</div><div class="field"><label>Currency *</label><div class="input">GBP · British pound <span class="blue">›</span></div><div class="hint">Choose a currency used by one of your accounts.</div></div><div class="field"><label>Budget amount *</label><div class="input ${invalid?'error':''}">${edit?'£400.00':invalid?'£0.00':'£0.00'}</div>${invalid?'<div class="hint error">Enter an amount above £0.</div>':''}</div><div class="field"><label>Colour *</label><div class="input ${invalid?'error':''}">${edit?'Blue':'Select a colour'} <span class="blue">›</span></div>${invalid?'<div class="hint error">Select a colour.</div>':''}</div><div class="field"><label>Icon *</label><div class="input">${edit?'Wallet':'Select an icon'} <span class="blue">›</span></div></div><div class="field" style="margin-bottom:0"><label>Categories *</label><div class="input ${invalid?'error':''}">${edit?'Groceries · Supermarkets':invalid?'Select categories':'Select categories'} <span class="blue">›</span></div>${invalid?'<div class="hint error">Select at least one category.</div>':''}</div></div></div><div class="footer"><div class="button">${edit?'Save changes':'Create budget'}</div></div>`;
const frames=[
 panel('1 · Budget overview','Browse budgets for the selected month and scan progress.',`<div class="nav">Budgets<span class="nav-right">+ New</span></div><div class="content"><h1 class="title">Budgets</h1><p class="sub">Plan and monitor your spending.</p>${month()}${summary()}<div class="section">YOUR BUDGETS</div>${budget('Groceries','£318','£400',80,'£82 remaining','near','▣')}${budget('Dining out','£222','£250',89,'£28 remaining','near','◫')}${budget('Transport','£75','£150',50,'£75 remaining','normal','▤')}</div>${tabs}`),
 panel('2 · Previous month','The month selection stays visible while amounts reload.',`<div class="nav">Budgets<span class="nav-right">+ New</span></div><div class="content"><h1 class="title">Budgets</h1><p class="sub">Plan and monitor your spending.</p>${month('September 2026',true)}${summary(true)}<div class="section">YOUR BUDGETS</div>${budget('Dining out','£296','£250',118,'£46 over budget','over','◫')}${budget('Groceries','£342','£400',86,'£58 remaining','near','▣')}${budget('Transport','£112','£150',75,'£38 remaining','normal','▤')}</div>${tabs}`),
 panel('3 · Budget detail','A focused progress card leads into matched transactions.',`${nav('Groceries','Edit')}<div class="content">${month()}<div class="card pad"><div class="card-title"><span class="icon">▣</span>Groceries <span class="badge" style="margin-left:auto">On track</span></div><div class="money big" style="margin-top:19px">£82</div><div class="hint">remaining this month</div><div class="progress" style="height:10px"><div class="fill warning-bg" style="width:80%"></div></div><div class="meta"><span><strong class="money">£318</strong> spent</span><span><strong class="money">£400</strong> budgeted</span></div></div><div class="section">BUDGET DETAILS</div><div class="card"><div class="row">Budget amount <strong class="money">£400</strong></div><div class="row">Currency <strong>GBP</strong></div><div class="row">Categories <strong>Groceries, supermarkets</strong></div></div>${transactions}<div class="section">MANAGE</div><div class="card"><div class="row red">Delete budget <span>›</span></div></div></div>`),
 panel('4 · Over-budget detail','The status and overage are explicit, with red reserved for the deficit.',`${nav('Dining out','Edit')}<div class="content">${month('September 2026',true)}<div class="card pad"><div class="card-title"><span class="icon red-icon">◫</span>Dining out <span class="badge over" style="margin-left:auto">Over budget</span></div><div class="money big red" style="margin-top:19px">£46</div><div class="hint">over the monthly limit</div><div class="progress" style="height:10px"><div class="fill red-bg" style="width:100%"></div></div><div class="meta"><span><strong class="money">£296</strong> spent</span><span><strong class="money">£250</strong> budgeted</span></div></div><div class="notice" style="margin-top:13px">You spent 18% more than planned in September.</div><div class="section">TRANSACTIONS THIS MONTH</div><div class="card"><div class="row"><span><strong>Pizza Express</strong><small>Dining out · 28 Sep</small></span><strong class="money red">−£58.00</strong></div><div class="row"><span><strong>Dishoom</strong><small>Dining out · 22 Sep</small></span><strong class="money red">−£72.00</strong></div><div class="row"><span><strong>Café Nero</strong><small>Dining out · 18 Sep</small></span><strong class="money red">−£13.20</strong></div></div><div class="section">MANAGE</div><div class="card"><div class="row red">Delete budget <span>›</span></div></div></div>`),
 panel('5 · Create budget','Follow the web form fields; explain the recurring monthly limit in copy.',`${nav('New budget')}${form()}`),
 panel('6 · Select categories','Searchable multi-select sheet preserves draft choices until applied.',`${nav('New budget')}<div class="content"><h1 class="title">Create a budget</h1><div class="card pad"><div class="field"><label>Name</label><div class="input">Groceries</div></div><div class="field"><label>Budget amount</label><div class="input">£400.00</div></div><div class="field"><label>Categories</label><div class="input">2 selected <span class="blue">›</span></div></div></div></div><div class="scrim"></div><div class="sheet"><div class="handle"></div><div class="sheet-head">Select categories <span>Close</span></div><div style="padding:17px"><div class="input muted">⌕ &nbsp; Search categories</div></div><div class="row"><span><strong>Food & drink</strong><small>Parent category</small></span></div><div class="row" style="padding-left:29px">Groceries <span class="check on">✓</span></div><div class="row" style="padding-left:29px">Supermarkets <span class="check on">✓</span></div><div class="row" style="padding-left:29px">Restaurants <span class="check"></span></div><div class="row"><span><strong>Transport</strong><small>Parent category</small></span></div><div class="row" style="padding-left:29px">Public transport <span class="check"></span></div><div class="footer"><div class="button">Apply 2 categories</div></div></div>`),
 panel('7 · Select currency','Currency choice keeps the form value explicit.',`${nav('New budget')}<div class="content"><h1 class="title">Create a budget</h1><div class="card pad"><div class="field"><label>Name</label><div class="input">Groceries</div></div><div class="field"><label>Budget amount</label><div class="input">400.00</div></div><div class="field"><label>Currency</label><div class="input">GBP · British pound <span class="blue">›</span></div></div></div></div><div class="scrim"></div><div class="sheet" style="height:490px"><div class="handle"></div><div class="sheet-head">Select currency <span>Close</span></div><div style="padding:17px"><div class="input muted">⌕ &nbsp; Search currencies</div></div><div class="row"><span><strong>GBP</strong><small>British pound</small></span><span class="check on">✓</span></div><div class="row"><span><strong>EUR</strong><small>Euro</small></span><span class="check"></span></div><div class="row"><span><strong>USD</strong><small>US dollar</small></span><span class="check"></span></div><div class="footer"><div class="button">Use GBP</div></div></div>`),
 panel('8 · Edit budget','The same fields return prefilled; saving updates the recurring budget.',`${nav('Edit budget')}${form(true)}`),
 panel('9 · Delete confirmation','The confirmation names the budget and explains transaction safety.',`${nav('Groceries','Edit')}<div class="content">${month()}${budget('Groceries','£318','£400',80,'£82 remaining','near','▣')}<div class="section">MANAGE</div><div class="card"><div class="row red">Delete budget <span>›</span></div></div></div><div class="scrim"></div><div class="dialog"><h3>Delete “Groceries”?</h3><p>This budget and its progress will be removed. Its transactions will stay in your account.</p><div class="button danger">Delete budget</div><div class="button outline">Keep budget</div></div>`),
 panel('10 · Empty month','The selected month remains visible when no budgets are available.',`<div class="nav">Budgets<span class="nav-right">+ New</span></div><div class="content"><h1 class="title">Budgets</h1><p class="sub">Plan and monitor your spending.</p>${month('January 2025',true)}<div class="card dashed center" style="margin-top:35px"><div class="icon">▥</div><h3>No budgets yet</h3><p>Create a monthly budget to see your spending against a limit here.</p><div class="button" style="width:100%">Create your first budget</div></div></div>${tabs}`),
 panel('11 · No matched transactions','A budget can exist before any spending is assigned to it.',`${nav('Transport','Edit')}<div class="content">${month()}<div class="card pad"><div class="card-title"><span class="icon">▤</span>Transport <span class="badge" style="margin-left:auto">On track</span></div><div class="money big" style="margin-top:18px">£150</div><div class="hint">remaining this month</div><div class="progress" style="height:10px"><div class="fill" style="width:0%"></div></div><div class="meta"><span>£0 spent</span><span>£150 budgeted</span></div></div><div class="section">TRANSACTIONS THIS MONTH</div><div class="card dashed center"><div class="icon">≡</div><h3>No transactions yet</h3><p>Transactions in the selected categories will appear here.</p></div></div>`),
 panel('12 · Loading budgets','Skeleton cards hold the layout while the selected month loads.',`<div class="nav">Budgets<span class="nav-right">+ New</span></div><div class="content"><h1 class="title">Budgets</h1>${month()}<div class="card pad"><div class="skeleton" style="width:44%"></div><div class="skeleton" style="width:72%;height:29px"></div><div class="skeleton" style="width:100%;height:8px;margin-top:18px"></div><div class="skeleton" style="width:70%"></div></div><div class="section">YOUR BUDGETS</div><div class="card pad"><div class="skeleton" style="width:57%"></div><div class="skeleton" style="width:100%;height:8px;margin-top:25px"></div><div class="skeleton" style="width:65%"></div></div><div class="card pad"><div class="skeleton" style="width:48%"></div><div class="skeleton" style="width:100%;height:8px;margin-top:25px"></div><div class="skeleton" style="width:69%"></div></div></div>${tabs}`),
 panel('13 · Validation and save error','Field errors appear beside inputs; failed saves keep the draft.',`${nav('New budget')}${form(false,true)}`),
 panel('14 · Delete error','A failed mutation leaves the user on the detail screen with a retry.',`${nav('Groceries','Edit')}<div class="content"><div class="toast">Couldn’t delete “Groceries”. Please try again.</div>${month()}${budget('Groceries','£318','£400',80,'£82 remaining','near','▣')}<div class="section">TRANSACTIONS THIS MONTH</div><div class="card"><div class="row"><span><strong>Tesco</strong><small>Groceries · 19 Oct</small></span><strong class="money red">−£42.80</strong></div></div><div class="section">MANAGE</div><div class="card"><div class="row red">Delete budget <span>›</span></div></div></div>`),
 panel('15 · Detail request error','A failed budget lookup keeps the month and gives a retry path.',`${nav('Budget')}<div class="content">${month()}<div class="card dashed center" style="margin-top:50px"><div class="icon red-icon">!</div><h3>Couldn’t load this budget</h3><p>It may have been deleted or is temporarily unavailable.</p><div class="button outline" style="width:100%">Try again</div></div></div>`),
