name: WEBAPP CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "apps/webapp/**"
  pull_request:
    branches:
      - "*"
    paths:
      - "apps/webapp/**"

jobs:
  build:
    name: Build WEBAPP
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        working-directory: apps/webapp
        run: pnpm install --frozen-lockfile

      - name: Run linter
        working-directory: apps/webapp
        run: pnpm lint

      - name: Run type check
        working-directory: apps/webapp
        run: pnpm tsc --noEmit

      - name: Build WEBAPP
        working-directory: apps/webapp
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webapp-dist
          path: apps/webapp/dist
          retention-days: 7

  react-doctor:
    name: React Doctor
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run React Doctor
        uses: millionco/react-doctor@main
        with:
          directory: apps/webapp
          diff: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
