name: WEBAPP CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "apps/webapp/**"
  pull_request:
    branches:
      - "*"
    paths:
      - "apps/webapp/**"

jobs:
  build:
    name: Build WEBAPP
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        working-directory: apps/webapp
        run: pnpm install --frozen-lockfile

      - name: Run linter
        working-directory: apps/webapp
        run: pnpm lint

      - name: Run type check
        working-directory: apps/webapp
        run: pnpm tsc --noEmit

      - name: Build WEBAPP
        working-directory: apps/webapp
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webapp-dist
          path: apps/webapp/dist
          retention-days: 7
