name: EAS Build
on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile (rebuild preview after native changes)
        type: choice
        default: preview
        options:
          - preview
          - production
          - development
      platform:
        description: Native platform
        type: choice
        default: all
        options:
          - all
          - android
          - ios

permissions:
  contents: read

jobs:
  build:
    name: EAS build
    runs-on: ubuntu-latest
    steps:
      - name: Check for EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Add EXPO_TOKEN to the repository's Actions secrets."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.x
          cache: 'pnpm'

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript check
        run: pnpm --filter mobile typecheck

      - name: Run linter
        run: pnpm --filter mobile lint

      - name: Run format check
        run: pnpm --filter mobile format:check

      - name: Build on EAS
        working-directory: apps/mobile
        env:
          BUILD_PROFILE: ${{ inputs.profile }}
          BUILD_PLATFORM: ${{ inputs.platform }}
        run: >-
          eas build --profile "$BUILD_PROFILE" --platform "$BUILD_PLATFORM"
          --non-interactive --no-wait
