name: API CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'apps/api/**'
      - 'packages/guallet-money/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - '.oxlintrc.json'
      - '.oxfmtrc.json'
      - 'turbo.json'
      - '.github/workflows/api-ci.yml'
  pull_request:
    branches:
      - '*'
    paths:
      - 'apps/api/**'
      - 'packages/guallet-money/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - '.oxlintrc.json'
      - '.oxfmtrc.json'
      - 'turbo.json'
      - '.github/workflows/api-ci.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: guallet_test
          POSTGRES_PASSWORD: guallet_test
          POSTGRES_DB: guallet_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U guallet_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      GUALLET_TEST_DATABASE_URL: postgresql://guallet_test:guallet_test@localhost:5432/guallet_test

    strategy:
      matrix:
        node-version: [24.20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        working-directory: apps/api
        run: pnpm install --frozen-lockfile

      - name: Build shared server money package
        run: pnpm --filter @guallet/money build

      - name: Run linter
        working-directory: apps/api
        run: pnpm lint

      - name: Check formatting
        working-directory: apps/api
        run: pnpm format:check

      - name: Run type check
        working-directory: apps/api
        run: pnpm tsc --noEmit

      - name: Run unit tests
        working-directory: apps/api
        run: pnpm test

      # - name: Run E2E tests
      #   working-directory: apps/api
      #   run: pnpm test:e2e
      #   env:
      #       NODE_ENV: test

      - name: Run tests coverage
        working-directory: apps/api
        run: pnpm test:cov

      - name: Build API
        working-directory: apps/api
        run: pnpm build

      - name: Verify packaged email templates
        working-directory: apps/api
        run: diff -r src/features/email/templates dist/features/email/templates

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: api-dist
          path: |
            apps/api/dist
            packages/guallet-money/dist
          retention-days: 7
