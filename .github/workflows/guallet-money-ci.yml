name: CI - guallet-money

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'packages/guallet-money/**'
      - '.github/workflows/guallet-money-ci.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'packages/guallet-money/**'
      - '.github/workflows/guallet-money-ci.yml'

jobs:
  test-and-lint:
    name: Test & Lint @guallet/money
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        working-directory: packages/guallet-money
        run: pnpm install --frozen-lockfile

      - name: Lint @guallet/money
        working-directory: packages/guallet-money
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Run type check
        working-directory: packages/guallet-money
        run: pnpm tsc --noEmit

      - name: Run unit tests and coverage (@guallet/money)
        working-directory: packages/guallet-money
        run: pnpm test:cov

      - name: Upload coverage report (@guallet/money)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guallet-money-coverage
          path: packages/guallet-money/coverage/
          if-no-files-found: ignore
