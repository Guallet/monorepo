name: WEB CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'apps/web/**'
  pull_request:
    branches:
      - '*'
    paths:
      - 'apps/web/**'

jobs:
  build:
    name: Build WEB
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Run linter
        working-directory: apps/web
        run: pnpm lint

      - name: Run type check
        working-directory: apps/web
        run: pnpm tsc --noEmit

      - name: Build WEB
        working-directory: apps/web
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7
