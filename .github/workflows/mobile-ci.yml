name: Mobile CI
on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/guallet-api-client/**'
      - 'packages/guallet-api-react/**'
      - 'packages/guallet-auth/**'
      - 'packages/guallet-calculators/**'
      - 'packages/guallet-luna-mobile/**'
      - 'packages/guallet-money/**'
      - 'packages/guallet-theme/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - '.oxlintrc.json'
      - '.oxfmtrc.json'
      - 'turbo.json'
      - '.github/workflows/mobile-ci.yml'
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate mobile app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        working-directory: apps/mobile
        run: pnpm lint

      - name: Run typecheck
        working-directory: apps/mobile
        run: pnpm typecheck

      - name: Run tests
        working-directory: apps/mobile
        run: pnpm test

      - name: Check formatting
        working-directory: apps/mobile
        run: pnpm format:check
