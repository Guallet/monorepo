name: EAS Update - Preview
on:
  workflow_dispatch:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: eas-update-${{ github.event.pull_request.number || 'preview' }}
  cancel-in-progress: false

jobs:
  update:
    name: Publish preview update
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
      - name: Check for EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Add EXPO_TOKEN to the repository's Actions secrets."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.20.x
          cache: 'pnpm'

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish update to preview channel
        id: channel-update
        if: github.event_name != 'pull_request'
        uses: expo/expo-github-action/preview@v8
        with:
          working-directory: apps/mobile
          comment: false
          command: >-
            eas update --channel preview --environment preview
            --platform all --message "develop ${{ github.sha }}" --non-interactive

      - name: Create pull request preview
        id: pr-preview
        if: github.event_name == 'pull_request'
        uses: expo/expo-github-action/preview@v8
        with:
          working-directory: apps/mobile
          command: >-
            eas update --branch pr-${{ github.event.pull_request.number }}
            --environment preview --platform all
            --message "PR #${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }}"
            --non-interactive

      - name: Write update summary
        env:
          UPDATE_LINK: ${{ steps.channel-update.outputs.link || steps.pr-preview.outputs.link }}
          UPDATE_QR: ${{ steps.channel-update.outputs.qr || steps.pr-preview.outputs.qr }}
        run: |
          printf '[View EAS update](%s)\n\n' "$UPDATE_LINK" >> "$GITHUB_STEP_SUMMARY"
          printf '![Update QR code](%s)\n' "$UPDATE_QR" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Sentry sourcemaps
        working-directory: apps/mobile
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        if: ${{ env.SENTRY_AUTH_TOKEN != '' }}
        run: pnpm exec sentry-expo-upload-sourcemaps dist
