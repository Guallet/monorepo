name: EAS Update - Development
on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - 'apps/mobile/**'
      - 'packages/guallet-api-client/**'
      - 'packages/guallet-api-react/**'
      - 'packages/guallet-auth/**'
      - 'packages/guallet-calculators/**'
      - 'packages/guallet-luna-mobile/**'
      - 'packages/guallet-money/**'
      - 'packages/guallet-theme/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - '.oxlintrc.json'
      - '.oxfmtrc.json'
      - 'turbo.json'
      - '.github/workflows/mobile-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate mobile app
    uses: ./.github/workflows/mobile-ci.yml

  update:
    name: EAS Update
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.20.x]
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "You must provide an EXPO_TOKEN secret linked to this project's Expo account in this repo's secrets. Learn more: https://docs.expo.dev/eas-update/github-actions"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: apps/mobile
        run: pnpm install

      - name: Create DEV .env file
        working-directory: apps/mobile
        run: |
          touch .env
          echo "${{ secrets.MOBILE_ENV_FILE_DEV }}" >> .env

      - name: Create Firebase Android config file
        working-directory: apps/mobile/auth/firebase
        run: |
          touch google-services.json
          echo "${{ secrets.FIREBASE_ANDROID_FILE_DEV }}" >> google-services.json

      - name: Create Firebase iOS config file
        working-directory: apps/mobile/auth/firebase
        run: |
          touch GoogleService-Info.plist
          echo "${{ secrets.FIREBASE_IOS_FILE_DEV }}" >> GoogleService-Info.plist

      - name: Publish update
        working-directory: apps/mobile
        run: eas update --auto

      - name: Upload Sentry Sourcemaps
        working-directory: apps/mobile
        run: npx sentry-expo-upload-sourcemaps dist
