packages:
  - apps/*
  - packages/*
allowBuilds:
  '@nestjs/core': true
  '@scarf/scarf': true
  '@sentry/cli': false
  '@swc/core': true
  core-js: true
  esbuild: true
  msgpackr-extract: false
  nestjs-pino: true
  unrs-resolver: true

nodeLinker: hoisted
saveExact: true
minimumReleaseAge: 1440

overrides:
  '@mantine/charts': 9.6.1
  '@mantine/core': 9.6.1
  '@mantine/dates': 9.6.1
  '@mantine/dropzone': 9.6.1
  '@mantine/form': 9.6.1
  '@mantine/hooks': 9.6.1
  '@mantine/modals': 9.6.1
  '@mantine/notifications': 9.6.1
  '@tabler/icons-react': 3.47.0
  '@tabler/icons-react-native': 3.47.0
  '@tanstack/react-query': 5.103.1
  '@vitest/coverage-v8': 5.0.1
  '@types/react': 19.2.14
  '@types/react-dom': 19.2.3
  better-auth: 1.7.4
  postcss: 8.5.28
  postcss-preset-mantine: 1.18.0
  postcss-simple-vars: 7.0.1
  react: 19.2.3
  react-dom: 19.2.3
  unplugin-swc: 1.6.0
  typescript: 7.0.2
  vite: 8.1.2
  vitest: 5.0.1
