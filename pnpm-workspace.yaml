packages:
  - apps/*
  - packages/*
allowBuilds:
  '@nestjs/core': true
  '@scarf/scarf': true
  '@sentry/cli': false
  '@swc/core': true
  core-js: true
  esbuild: true
  msgpackr-extract: false
  nestjs-pino: true
  unrs-resolver: true

nodeLinker: hoisted
saveExact: true
minimumReleaseAge: 1440

overrides:
  '@mantine/charts': 9.0.0
  '@mantine/core': 9.0.0
  '@mantine/dates': 9.0.0
  '@mantine/dropzone': 9.0.0
  '@mantine/form': 9.0.0
  '@mantine/hooks': 9.0.0
  '@mantine/modals': 9.0.0
  '@mantine/notifications': 9.0.0
  '@tabler/icons-react': 3.34.0
  '@tanstack/react-query': 5.90.2
  '@vitest/coverage-v8': 5.0.0
  '@types/react': 19.2.14
  '@types/react-dom': 19.2.3
  better-auth: 1.4.18
  postcss: 8.5.6
  postcss-preset-mantine: 1.18.0
  postcss-simple-vars: 7.0.1
  react: 19.2.4
  react-dom: 19.2.4
  unplugin-swc: 1.6.0
  typescript: 5.9.3
  vite: 8.1.2
  vitest: 5.0.0
