version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: guallet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: guallet
      POSTGRES_PASSWORD: guallet_password
      POSTGRES_DB: guallet
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - guallet-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guallet"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for BullMQ
  redis:
    image: redis:7-alpine
    container_name: guallet-redis
    restart: unless-stopped
    command: redis-server --requirepass guallet_redis_password
    volumes:
      - redis_data:/data
    networks:
      - guallet-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin for Database Management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: guallet-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@guallet.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - guallet-network
    depends_on:
      - postgres

  # API Service
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: guallet-api
    restart: unless-stopped
    environment:
      # Application
      ENVIRONMENT: production
      PORT: 5000
      NODE_ENV: production
      
      # CORS
      ALLOWED_CORS_ORIGINS: "http://localhost:3000,http://localhost:5000"
      
      # Database - Using internal Docker network
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: guallet
      DATABASE_PASSWORD: guallet_password
      DATABASE_NAME: guallet
      
      # Redis - Using internal Docker network
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: guallet_redis_password
      
      # These need to be configured by the user
      NORDIGEN_SECRET_ID: ${NORDIGEN_SECRET_ID:-}
      NORDIGEN_SECRET_KEY: ${NORDIGEN_SECRET_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Guallet <no-reply@example.com>}
      APITALLY_ENABLED: ${APITALLY_ENABLED:-false}
      APITALLY_CLIENT_ID: ${APITALLY_CLIENT_ID:-}
      APITALLY_ENV: ${APITALLY_ENV:-prod}
    ports:
      - "5000:5000"
    networks:
      - guallet-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # WebApp Service
  webapp:
    build:
      context: .
      dockerfile: apps/webapp/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_KEY: ${VITE_SUPABASE_KEY}
        VITE_SENTRY_ENABLED: ${VITE_SENTRY_ENABLED:-false}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    container_name: guallet-webapp
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - guallet-network
    depends_on:
      - api

networks:
  guallet-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
